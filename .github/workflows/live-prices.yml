# Refreshes price files once a day and commits them to public/prices/:
#   community.json  shopper-reported prices for every chain (Open Prices / Open Food Facts) — no key needed
#   live.json       live Kroger-family prices for one ZIP — needs free Kroger keys (optional)
# Free: runs on GitHub Actions' included minutes. The deploy workflow republishes the site afterwards.
#
# Optional repository settings (Settings → Secrets and variables → Actions):
#   Secrets   → KROGER_CLIENT_ID, KROGER_CLIENT_SECRET   (free app at developer.kroger.com)
#   Variables → KROGER_ZIP (e.g. 45202) or KROGER_LOCATION_ID
name: Live prices

on:
  schedule:
    - cron: '17 9 * * *' # daily, 09:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: live-prices
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      KROGER_CLIENT_ID: ${{ secrets.KROGER_CLIENT_ID }}
      KROGER_CLIENT_SECRET: ${{ secrets.KROGER_CLIENT_SECRET }}
      KROGER_ZIP: ${{ vars.KROGER_ZIP }}
      KROGER_LOCATION_ID: ${{ vars.KROGER_LOCATION_ID }}
      KROGER_API_BASE: ${{ vars.KROGER_API_BASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Shopper-reported prices (Open Prices)
        run: npm run prices:community
      - name: Regional price levels (U.S. Bureau of Labor Statistics)
        run: npm run prices:regional
        continue-on-error: true
      - name: Kroger live prices
        if: env.KROGER_CLIENT_ID != ''
        run: npm run prices:kroger
      - name: Commit if changed
        run: |
          if git diff --quiet -- public/prices; then
            echo "No price changes."
            exit 0
          fi
          git config user.name "prepline-prices-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/prices
          git commit -m "Update daily prices"
          git push
